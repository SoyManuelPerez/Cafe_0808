<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Ventas</title>
    <style>
        :root {
            --gold-bright: #ffd700;
            --gold-primary: #d4af37;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-light: #ffffff;
            --text-dim: #a0a0a0;
            --danger: #e74c3c;
            --success: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        h1, h2, h3 {
            color: var(--gold-bright);
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #2a2a2a;
            color: var(--gold-primary);
        }

        input, select, button {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-gold {
            background-color: var(--gold-primary);
            color: #000;
            font-weight: bold;
            border: none;
        }

        .btn-gold:hover {
            background-color: var(--gold-bright);
        }

        .btn-danger {
            background-color: var(--danger);
            color: #fff;
            border: none;
        }

        /* MODAL STYLES */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-container {
            background-color: var(--bg-card);
            border: 1px solid var(--gold-primary);
            border-radius: 8px;
            width: 90%;
            padding: 20px;
        }

        .modal-small {
            max-width: 400px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- SECCIÓN DE VENTAS VENDEDOR -->
        <div class="card">
            <h2>🛒 Mi Histórico de Ventas</h2>
            <div id="contenedor-mis-ventas">
                <table id="tabla-mis-ventas">
                    <thead>
                        <tr>
                            <th>N° Factura</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Tipo Pago</th>
                            <th>Total</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-mis-ventas">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- SECCIÓN DE REPORTES (ADMIN) -->
        <div class="card" id="seccion-reportes">
            <h2>📊 Reporte General de Ventas</h2>
            <table id="tabla-reportes">
                <thead>
                    <tr>
                        <th>N° Factura</th>
                        <th>Fecha</th>
                        <th>Vendedor</th>
                        <th>Cliente</th>
                        <th>Tipo Pago</th>
                        <th>Total</th>
                        <th>Acciones</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody id="tbody-reportes">
                    <!-- Carga dinámica -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL EDITAR DETALLES DE VENTA -->
    <div id="modal-editar-venta" class="modal-overlay">
        <div class="modal-container modal-small">
            <div class="modal-header">
                <h3 style="margin:0; color:var(--gold-bright);">✏️ Editar Venta</h3>
                <button onclick="cerrarModalEditarVenta()" style="width:auto; padding:5px 12px; background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✖</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-venta-id">
                
                <label style="color:var(--gold-primary); display:block; margin-bottom:5px;">Cliente:</label>
                <select id="edit-venta-cliente" style="width:100%; margin-bottom:15px;"></select>

                <label style="color:var(--gold-primary); display:block; margin-bottom:5px;">Método de Pago:</label>
                <select id="edit-venta-pago" style="width:100%; margin-bottom:15px;">
                    <option value="Contado">Contado</option>
                    <option value="Crédito">Crédito</option>
                </select>

                <button class="btn-gold" style="margin-top:10px; width:100%;" onclick="guardarCambiosVenta()">💾 Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script>
        // ESTADO GLOBAL
        let tokenActual = localStorage.getItem('token') || '';
        let rolActual = localStorage.getItem('rol') || 'vendedor';
        let clientesCache = [];

        // AL CARGAR LA PÁGINA
        document.addEventListener('DOMContentLoaded', () => {
            cargarClientes();
            cargarMisVentas();
            if (rolActual === 'admin') {
                cargarReportes();
            }
        });

        // OBTENER CLIENTES PARA EL SELECT
        async function cargarClientes() {
            try {
                const res = await fetch('/api/clientes', {
                    headers: { 'Authorization': `Bearer ${tokenActual}` }
                });
                if (res.ok) {
                    clientesCache = await res.json();
                }
            } catch (err) {
                console.error("Error al obtener clientes:", err);
            }
        }

        // MI HISTÓRICO DE VENTAS
        async function cargarMisVentas() {
            try {
                const res = await fetch('/api/ventas/mis-ventas', {
                    headers: { 'Authorization': `Bearer ${tokenActual}` }
                });
                if (!res.ok) return;

                const ventas = await res.json();
                const tbody = document.getElementById('tbody-mis-ventas');
                tbody.innerHTML = '';

                ventas.forEach(v => {
                    const idVal = v.id;
                    const numFact = v.factura || 'N/A';
                    const esCredito = v.tipo_pago === 'Crédito';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${numFact}</td>
                        <td>${v.fecha || ''}</td>
                        <td>${v.cliente || 'Cliente General'}</td>
                        <td>${v.tipo_pago || 'Contado'}</td>
                        <td>$${(v.total || 0).toLocaleString()}</td>
                        <td>
                            <button class="btn-gold" style="padding: 4px 10px; width:auto; display:inline-flex;" onclick="abrirModalPdf('/api/ventas/${idVal}/pdf', 'Factura N° ${numFact}', 'Factura_${numFact}.pdf')">👁️ Ver Factura</button>
                            <button class="btn-gold" style="padding: 4px 10px; width:auto; margin-left:5px; display:inline-flex;" onclick="abrirModalEditarVenta('${idVal}', '${v.cliente}', '${v.tipo_pago}')">✏️ Editar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error al cargar ventas del vendedor:", err);
            }
        }

        // CARGAR REPORTES (VISTA ADMIN)
        async function cargarReportes() {
            try {
                const res = await fetch('/api/ventas/reporte-general', {
                    headers: { 'Authorization': `Bearer ${tokenActual}` }
                });
                if (!res.ok) return;

                const ventas = await res.json();
                const tbody = document.getElementById('tbody-reportes');
                tbody.innerHTML = '';

                ventas.forEach(v => {
                    const idVal = v.id;
                    const numFact = v.factura || 'N/A';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${numFact}</td>
                        <td>${v.fecha || ''}</td>
                        <td>${v.vendedor || ''}</td>
                        <td>${v.cliente || 'Cliente General'}</td>
                        <td>${v.tipo_pago || 'Contado'}</td>
                        <td>$${(v.total || 0).toLocaleString()}</td>
                        <td>
                            <button class="btn-gold" style="padding: 4px 10px; width:auto; display:inline-flex;" onclick="abrirModalPdf('/api/ventas/${idVal}/pdf', 'Factura N° ${numFact}', 'Factura_${numFact}.pdf')">👁️ Ver Factura</button>
                            <button class="btn-gold" style="padding: 4px 10px; width:auto; margin-left:5px; display:inline-flex;" onclick="abrirModalEditarVenta('${idVal}', '${v.cliente}', '${v.tipo_pago}')">✏️ Editar</button>
                        </td>
                        <td><button class="btn-danger" onclick="eliminarVenta('${idVal}')">❌</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error al cargar reporte general:", err);
            }
        }

        // MODAL DE EDICIÓN
        function abrirModalEditarVenta(id, clienteActual, tipoPagoActual) {
            document.getElementById('edit-venta-id').value = id;

            // Llenar select de clientes
            const selectCli = document.getElementById('edit-venta-cliente');
            const list = Array.isArray(clientesCache) ? clientesCache : [];
            
            let options = '<option value="Cliente General">Cliente General</option>' +
                list.map(c => `<option value="${c.nombre}">${c.nombre} (${c.celular || 'Sin Celular'})</option>`).join('');
            
            selectCli.innerHTML = options;
            selectCli.value = clienteActual || "Cliente General";

            // Llenar select de tipo de pago
            const selectPago = document.getElementById('edit-venta-pago');
            selectPago.value = (tipoPagoActual === 'Efectivo') ? 'Contado' : (tipoPagoActual || 'Contado');

            document.getElementById('modal-editar-venta').style.display = 'flex';
        }

        function cerrarModalEditarVenta() {
            document.getElementById('modal-editar-venta').style.display = 'none';
            document.getElementById('edit-venta-id').value = '';
        }

        // GUARDAR CAMBIOS (PUT AL BACKEND)
        async function guardarCambiosVenta() {
            const ventaId = document.getElementById('edit-venta-id').value;
            const nuevoCliente = document.getElementById('edit-venta-cliente').value;
            const nuevoTipoPago = document.getElementById('edit-venta-pago').value;

            if (!ventaId) return;

            try {
                const res = await fetch(`/api/ventas/${ventaId}/editar-detalles`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${tokenActual}`
                    },
                    body: JSON.stringify({
                        cliente: nuevoCliente,
                        tipo_pago: nuevoTipoPago
                    })
                });

                if (res.ok) {
                    alert('Venta actualizada exitosamente.');
                    cerrarModalEditarVenta();
                    cargarMisVentas();
                    if (rolActual === 'admin') cargarReportes();
                } else {
                    const err = await res.json();
                    alert(err.detail || 'Error al actualizar la venta.');
                }
            } catch (err) {
                console.error("Error al editar venta:", err);
                alert('Ocurrió un error de conexión al actualizar.');
            }
        }

        function abrirModalPdf(url, titulo, nombreArchivo) {
            window.open(url, '_blank');
        }

        async function eliminarVenta(id) {
            if (!confirm('¿Estás seguro de eliminar esta venta?')) return;
            try {
                const res = await fetch(`/api/ventas/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${tokenActual}` }
                });
                if (res.ok) {
                    cargarMisVentas();
                    if (rolActual === 'admin') cargarReportes();
                }
            } catch (err) {
                console.error("Error al eliminar venta:", err);
            }
        }
    </script>
</body>
</html>
